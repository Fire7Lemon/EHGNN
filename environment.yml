# Conda 基础环境规格（论文复现 EHGNN / reproduce-baseline）
# - 不含 prefix，不含本机绝对路径；clone 后在任意机器上可用 conda env create -f environment.yml
# - PyTorch / DGL / torch-scatter / CUDA 变体请按服务器 GPU 与官方 wheel，勿写入此文件的 conda dependencies；
#   参见 docs/环境配置说明.md 与后续安装脚本（若有）。
name: ehgnn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
